project:
  type: website
  pre-render:
    # Regenera los PDF del CV si han cambiado sus datos
    - CV/_scripts/build-pdf.R
    # Guarda en la web los proyectos aprobados del archivador de la comunidad
    - Researcher/_scripts/drawer-snapshot.R
resources:
  - assets/**
  - CV/*.pdf
  - CV/assets/**
  - Researcher/assets/community-drawer.json
website:
  title: "Alicia Franco-Martínez"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  navbar:
    logo: assets/logo.png
    right:
      - text: Person
        href: index.qmd
      - text: Researcher
        href: Researcher/Researcher.qmd
      - text: Visitor
        href: Visitor/Visitor.qmd
      - text: CV
        href: cv.qmd
      
format:
  html:
    anchor-sections: false
    mainfont: 'DM Serif Display'
    theme: [cosmo, styles.scss]
    css: styles.scss
