# INVITED TALKS & WORKSHOPS
# Campos:
#   date      fecha (para dos líneas usa una lista: ["Feb 2025", "& Mar 2024"])
#   title     p. ej. "Seminar about *creativity*" (lo que va en *cursiva* sale en negrita cursiva)
#   place     lugar (📍)
#   org       entidad organizadora
#   detail    título de la charla (sale en cursiva)
#   link      enlace (🔗) — opcional
#   duration  duración, p. ej. "1.5h"

title: "Invited Talks & Workshops"
