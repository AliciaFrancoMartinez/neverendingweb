# PUBLICATIONS
# Grupos (barras marrones) con entradas. Campos de cada publicación:
#   date         año (o "In press", "Now"…). Puede quedar vacío: ""
#   authors      tal cual; tu nombre se pone en negrita solo (ver profile.yml → highlight)
#   title        título del trabajo
#   venue        revista / libro, con *cursiva* donde toque
#   doi          solo el doi (sin https://doi.org/)   ← opcional
#   doi_label    texto antes del doi (por defecto "doi:")
#   extra        línea adicional (p. ej. editorial e ISBN)
#   open_access  true → icono naranja de Open Access
#   icon         emoji delante de la revista (por defecto 📰)
#   badges       badges de ciencia abierta:  yes = en color · no = negro · na = gris (no aplica)
#   short        true → aparece en el CV corto (en formato de cita compacta)

title: "Publications"
legend: true          # muestra la leyenda Open Access + badges junto al título
web_filter: groups    # en la web, botones para filtrar por grupo (usan el campo "chip" de cada grupo)

