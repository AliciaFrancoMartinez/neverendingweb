# CONFERENCES
# Cada congreso:
#   date, event, place, role (texto a la derecha, p. ej. "Organizer")
#   tag            etiqueta bajo la fecha si no hay contribuciones (p. ej. "Attend.")
#   contributions  lista de comunicaciones:
#       type     Oral · Poster · Symposium · …  (etiqueta oscura a la izquierda)
#       authors  tu nombre se pone en negrita solo
#       title
#       link     enlace (🔗) — opcional
#       video    enlace a vídeo (📽) — opcional
#       note     texto tras el título, p. ej. "[Best Oral Communication Award]"
#   CV corto: los congresos con  short: true  se agrupan por  series  ("ASSC Annual Meetings - Tokyo 2024; …");
#             short_note añade una nota entre corchetes (p. ej. un premio)

title: "Conferences"
web_filter: types   # en la web, botones para filtrar por tipo (Oral, Poster…)
web_limit: 6        # en la web se ven los 6 primeros y un botón "Show all"

