# SKILLS, LANGUAGES & OTHER
# Grupos con items. Cada item puede ser:
#   { title, text }   → título en negrita y debajo el texto (text puede ser una lista de líneas)
#   "texto"           → una línea suelta (admite **negrita**)
# short: true  → aparece en el CV corto (o una lista [título, texto…] para una versión abreviada)
# Versión en español: el mismo campo con _es (title_es, text_es…). Las líneas sueltas
# ("texto") se traducen en es.yml. Ver _LEEME.md

